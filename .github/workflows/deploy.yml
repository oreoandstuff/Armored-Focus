name: Deploy to Cloudflare Pages

# Deploy every branch to Cloudflare Pages on push. Wrangler's `--branch` flag
# gives each branch its own preview URL (https://<branch>.armored-focus.pages.dev);
# the production branch (main) publishes to the root armored-focus.pages.dev.
on:
  push:
    branches:
      - '**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy .svelte-kit/cloudflare
            --project-name=armored-focus
            --branch=${{ github.ref_name }}
